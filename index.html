<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lidar zones</title>
<style>
  :root {
    --bg: #101418;
    --panel: #1b222b;
    --line: #2c3846;
    --text: #e7edf2;
    --muted: #8d9aaa;
    --ok: #3ddc97;
    --l1: #f0a202;
    --l2: #ff5d5d;
    --fault: #9aa6b2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 "Segoe UI", sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 18px; font-weight: 600; }
  #badge {
    min-width: 92px;
    text-align: center;
    padding: 6px 12px;
    border-radius: 999px;
    font-weight: 700;
    letter-spacing: 0.04em;
    background: #2a3340;
    color: var(--fault);
  }
  #badge.OK { background: #143528; color: var(--ok); }
  #badge.L1 { background: #3a2d10; color: var(--l1); }
  #badge.L2 { background: #3a1616; color: var(--l2); }
  #badge.FAULT, #badge.WAIT { background: #2a3340; color: var(--fault); }
  .layout {
    display: grid;
    grid-template-columns: minmax(280px, 640px) minmax(260px, 380px);
    gap: 18px;
    padding: 18px;
    align-items: start;
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
  }
  canvas {
    width: 100%;
    height: auto;
    background: #0c1014;
    border: 1px solid var(--line);
    border-radius: 12px;
    touch-action: none;
    cursor: crosshair;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
  }
  .row { display: flex; gap: 10px; margin-bottom: 10px; }
  label { display: flex; flex-direction: column; gap: 4px; flex: 1; color: var(--muted); font-size: 12px; }
  input[type="number"] {
    width: 100%;
    background: #0e141b;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px;
    font-size: 15px;
  }
  .modes { display: flex; gap: 8px; margin-bottom: 10px; }
  button {
    background: #243140;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 14px;
    cursor: pointer;
  }
  button.active { background: #31485f; border-color: #4d6d8c; }
  button.primary { background: #1d4d3a; border-color: #2f7a5a; }
  button:disabled { opacity: 0.5; cursor: default; }
  .hint { color: var(--muted); font-size: 13px; min-height: 36px; margin: 0 0 10px; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin-top: 8px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
</style>
</head>
<body>
<header>
  <h1>Lidar zones</h1>
  <div id="badge">WAIT</div>
</header>
<div class="layout">
  <div>
    <canvas id="plot" width="640" height="640"></canvas>
    <div class="legend">
      <span><i class="sw" style="background:#3ddc97"></i>clear</span>
      <span><i class="sw" style="background:#f0a202"></i>L1 slow</span>
      <span><i class="sw" style="background:#ff5d5d"></i>L2 stop</span>
      <span><i class="sw" style="background:#8d9aaa"></i>blank / chassis</span>
      <span><i class="sw" style="background:#3a4450"></i>ignored half</span>
    </div>
  </div>
  <div class="panel">
    <div class="modes">
      <button id="dir-f" type="button">Forward</button>
      <button id="dir-r" type="button">Reverse</button>
      <button id="dir-s" class="active" type="button">Stopped</button>
    </div>
    <p class="hint" id="dir-hint">Stopped. Both halves can warn.</p>
    <div class="modes">
      <button id="mode-zones" class="active" type="button">Move zones</button>
      <button id="mode-blank" type="button">Blank rays</button>
    </div>
    <p class="hint" id="hint">Drag the yellow L1 ring or the red L2 ring. 0° is forward, angles increase clockwise.</p>
    <div class="row">
      <label>L1 mm<input id="l1" type="number" min="100" max="12000" step="10"></label>
      <label>L2 mm<input id="l2" type="number" min="50" max="11999" step="10"></label>
      <label>0° offset<input id="offset" type="number" step="1"></label>
    </div>
    <div class="row">
      <label>Adjacent bins<input id="adjacent" type="number" min="1" max="30"></label>
      <label>Confirm scans<input id="confirm" type="number" min="1" max="20"></label>
      <label>Clear scans<input id="clear" type="number" min="1" max="20"></label>
    </div>
    <div class="row">
      <label>Chassis margin mm<input id="margin" type="number" min="0" max="500"></label>
      <label>Teach max mm<input id="cmax" type="number" min="50" max="2000"></label>
    </div>
    <div class="row">
      <button id="apply" class="primary" type="button">Apply</button>
      <button id="revert" type="button">Revert</button>
      <button id="teach" type="button">Teach chassis</button>
      <button id="clear-blank" type="button">Clear blanks</button>
    </div>
    <div class="meta" id="meta">Waiting for lidar-guard.</div>
    <div class="meta" id="sectors"></div>
  </div>
</div>
<script>
const canvas = document.getElementById("plot");
const ctx = canvas.getContext("2d");
const badge = document.getElementById("badge");
const hint = document.getElementById("hint");
const meta = document.getElementById("meta");
const sectorsEl = document.getElementById("sectors");

const el = {
  l1: document.getElementById("l1"),
  l2: document.getElementById("l2"),
  offset: document.getElementById("offset"),
  adjacent: document.getElementById("adjacent"),
  confirm: document.getElementById("confirm"),
  clear: document.getElementById("clear"),
  margin: document.getElementById("margin"),
  cmax: document.getElementById("cmax")
};

let port = "/dev/ttyUSB0";
let baud = 460800;
let blank = new Array(360).fill(false);
let chassis = new Array(360).fill(0);
let dist = new Array(360).fill(0);
let mode = "zones";
let dirty = false;
let teaching = false;
let drag = null;
let lastMs = null;
let lastChange = 0;
let hz = 0;
let level = "WAIT";
let travel = "S";

function num(input, fallback) {
  const v = Number(input.value);
  return Number.isFinite(v) ? v : fallback;
}

function sectorsToMask(sectors) {
  const m = new Array(360).fill(false);
  for (const s of sectors || []) {
    let i = ((s.start_deg % 360) + 360) % 360;
    const end = ((s.end_deg % 360) + 360) % 360;
    for (let n = 0; n < 360; n++) {
      m[i] = true;
      if (i === end) break;
      i = (i + 1) % 360;
    }
  }
  return m;
}

function maskToSectors(mask) {
  const sectors = [];
  let run = -1;
  for (let i = 0; i < 360; i++) {
    if (mask[i]) {
      if (run < 0) run = i;
    } else if (run >= 0) {
      sectors.push({ start_deg: run, end_deg: i - 1 });
      run = -1;
    }
  }
  if (run >= 0) {
    if (sectors.length && sectors[0].start_deg === 0) sectors[0].start_deg = run;
    else sectors.push({ start_deg: run, end_deg: 359 });
  }
  return sectors;
}

function applyConfig(cfg) {
  port = cfg.port || port;
  baud = cfg.baud || baud;
  el.l1.value = cfg.l1_mm;
  el.l2.value = cfg.l2_mm;
  el.offset.value = cfg.angle_offset_deg || 0;
  el.adjacent.value = cfg.min_adjacent;
  el.confirm.value = cfg.confirm_scans;
  el.clear.value = cfg.clear_scans;
  el.margin.value = cfg.chassis_margin_mm;
  el.cmax.value = cfg.chassis_max_mm;
  blank = sectorsToMask(cfg.blank_sectors);
  chassis = new Array(360).fill(0);
  const src = cfg.chassis_mm || [];
  for (let i = 0; i < 360; i++) chassis[i] = src[i] || 0;
  dirty = false;
  draw();
}

function collect(teachFlag) {
  let l1 = num(el.l1, 1500);
  let l2 = num(el.l2, 600);
  if (l2 >= l1) l2 = l1 - 1;
  el.l2.value = l2;
  return {
    port, baud,
    angle_offset_deg: num(el.offset, 0),
    l1_mm: l1,
    l2_mm: l2,
    min_adjacent: num(el.adjacent, 3),
    confirm_scans: num(el.confirm, 2),
    clear_scans: num(el.clear, 3),
    chassis_margin_mm: num(el.margin, 40),
    chassis_max_mm: num(el.cmax, 400),
    teach_chassis: !!teachFlag,
    blank_sectors: maskToSectors(blank),
    chassis_mm: chassis.slice()
  };
}

async function loadConfig() {
  const res = await fetch("/api/config");
  applyConfig(await res.json());
}

function markDirty() { dirty = true; draw(); }

for (const input of Object.values(el)) input.addEventListener("input", markDirty);

document.getElementById("mode-zones").onclick = () => setMode("zones");
document.getElementById("mode-blank").onclick = () => setMode("blank");

function setMode(next) {
  mode = next;
  document.getElementById("mode-zones").classList.toggle("active", mode === "zones");
  document.getElementById("mode-blank").classList.toggle("active", mode === "blank");
  hint.textContent = mode === "zones"
    ? "Drag the yellow L1 ring or the red L2 ring. 0° is forward, angles increase clockwise."
    : "Drag across rays to blank the chassis. Drag a blank ray again to restore it.";
}

function pointerPos(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (canvas.width / r.width),
    y: (e.clientY - r.top) * (canvas.height / r.height)
  };
}

function geom() {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const plotR = canvas.width / 2 - 28;
  const l1 = num(el.l1, 1500);
  const view = Math.max(l1 * 1.3, 1200);
  return { cx, cy, plotR, view, l1, l2: num(el.l2, 600) };
}

function degOf(x, y, g) {
  const dx = x - g.cx;
  const dy = y - g.cy;
  let deg = Math.atan2(dx, -dy) * 180 / Math.PI;
  if (deg < 0) deg += 360;
  return deg;
}

function ringRadius(mm, g) {
  return Math.max(0, Math.min(g.plotR, (mm / g.view) * g.plotR));
}

canvas.addEventListener("pointerdown", (e) => {
  if (teaching) return;
  canvas.setPointerCapture(e.pointerId);
  const p = pointerPos(e);
  const g = geom();
  const dx = p.x - g.cx;
  const dy = p.y - g.cy;
  const r = Math.hypot(dx, dy);
  if (mode === "zones") {
    const rl1 = ringRadius(g.l1, g);
    const rl2 = ringRadius(g.l2, g);
    const d1 = Math.abs(r - rl1);
    const d2 = Math.abs(r - rl2);
    if (d2 <= 14 && d2 <= d1) drag = { kind: "l2" };
    else if (d1 <= 14) drag = { kind: "l1" };
    else drag = null;
    if (drag) applyDrag(r, g);
  } else {
    const deg = Math.round(degOf(p.x, p.y, g)) % 360;
    drag = { kind: "blank", value: !blank[deg], last: deg };
    blank[deg] = drag.value;
    dirty = true;
  }
  draw();
});

canvas.addEventListener("pointermove", (e) => {
  const p = pointerPos(e);
  const g = geom();
  const dx = p.x - g.cx;
  const dy = p.y - g.cy;
  const r = Math.hypot(dx, dy);
  const deg = degOf(p.x, p.y, g);
  const mm = Math.round((r / g.plotR) * g.view);
  if (!drag) {
    meta.textContent = statusLine(deg, mm);
    return;
  }
  if (drag.kind === "l1" || drag.kind === "l2") applyDrag(r, g);
  else paintTo(Math.round(deg) % 360);
  draw();
  meta.textContent = statusLine(deg, mm);
});

function endDrag() { drag = null; }
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);

function applyDrag(r, g) {
  let mm = Math.round((r / g.plotR) * g.view);
  if (drag.kind === "l1") {
    const floor = num(el.l2, 600) + 1;
    mm = Math.max(floor, Math.min(12000, mm));
    el.l1.value = mm;
  } else {
    const cap = num(el.l1, 1500) - 1;
    mm = Math.max(50, Math.min(cap, mm));
    el.l2.value = mm;
  }
  dirty = true;
}

function paintTo(deg) {
  let d = deg - drag.last;
  while (d > 180) d -= 360;
  while (d < -180) d += 360;
  const steps = Math.max(1, Math.ceil(Math.abs(d)));
  for (let s = 0; s <= steps; s++) {
    const a = Math.round((drag.last + (d * s) / steps + 360) % 360) % 360;
    blank[a] = drag.value;
  }
  drag.last = deg;
  dirty = true;
}

function frontBin(i) {
  return i <= 90 || i >= 270;
}

function binWatched(i) {
  if (travel === "F") return frontBin(i);
  if (travel === "R") return !frontBin(i);
  return true;
}

function dirText() {
  if (travel === "F") return "Forward. Warnings use 270°–90°.";
  if (travel === "R") return "Reverse. Warnings use 90°–270°.";
  return "Stopped. Both halves can warn.";
}

function highlightDir() {
  document.getElementById("dir-f").classList.toggle("active", travel === "F");
  document.getElementById("dir-r").classList.toggle("active", travel === "R");
  document.getElementById("dir-s").classList.toggle("active", travel === "S");
  document.getElementById("dir-hint").textContent = dirText();
}

function isBody(i, mm) {
  const body = chassis[i] || 0;
  if (!body) return false;
  return mm + num(el.margin, 40) >= body;
}

function draw() {
  const g = geom();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#0c1014";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < 360; i++) {
    if (!blank[i]) continue;
    const a0 = (i - 0.5 - 90) * Math.PI / 180;
    const a1 = (i + 0.5 - 90) * Math.PI / 180;
    ctx.beginPath();
    ctx.moveTo(g.cx, g.cy);
    ctx.arc(g.cx, g.cy, g.plotR, a0, a1);
    ctx.closePath();
    ctx.fillStyle = "#1a2430";
    ctx.fill();
  }

  ctx.strokeStyle = "#243140";
  ctx.lineWidth = 1;
  for (let frac of [0.25, 0.5, 0.75, 1]) {
    ctx.beginPath();
    ctx.arc(g.cx, g.cy, g.plotR * frac, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(g.cx, g.cy - g.plotR);
  ctx.lineTo(g.cx, g.cy + g.plotR);
  ctx.moveTo(g.cx - g.plotR, g.cy);
  ctx.lineTo(g.cx + g.plotR, g.cy);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(g.cx, g.cy, ringRadius(g.l1, g), 0, Math.PI * 2);
  ctx.strokeStyle = "#f0a202";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(g.cx, g.cy, ringRadius(g.l2, g), 0, Math.PI * 2);
  ctx.strokeStyle = "#ff5d5d";
  ctx.lineWidth = 2;
  ctx.stroke();

  if (travel !== "S") {
    ctx.beginPath();
    ctx.moveTo(g.cx, g.cy);
    if (travel === "F") ctx.arc(g.cx, g.cy, g.plotR, 0, Math.PI);
    else ctx.arc(g.cx, g.cy, g.plotR, Math.PI, 0);
    ctx.closePath();
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fill();
  }

  for (let i = 0; i < 360; i++) {
    const mm = dist[i];
    if (!mm) continue;
    const rr = Math.min(g.plotR, (mm / g.view) * g.plotR);
    const rad = (i - 90) * Math.PI / 180;
    const x = g.cx + rr * Math.cos(rad);
    const y = g.cy + rr * Math.sin(rad);
    let color = "#3ddc97";
    if (!binWatched(i)) color = "#3a4450";
    else if (blank[i] || isBody(i, mm)) color = "#8d9aaa";
    else if (mm <= g.l2) color = "#ff5d5d";
    else if (mm <= g.l1) color = "#f0a202";
    ctx.fillStyle = color;
    ctx.fillRect(x - 1.6, y - 1.6, 3.2, 3.2);
  }

  ctx.fillStyle = "#d5dee6";
  ctx.font = "13px sans-serif";
  ctx.fillText("0°", g.cx - 8, 18);
  if (travel === "F") ctx.fillText("FRONT", g.cx - 24, g.cy - 16);
  if (travel === "R") ctx.fillText("REAR", g.cx - 18, g.cy + 28);
  const sectors = maskToSectors(blank);
  const chassisN = chassis.filter((v) => v > 0).length;
  sectorsEl.textContent = sectors.length
    ? "Blank " + sectors.map((s) => s.start_deg + "°–" + s.end_deg + "°").join(", ")
    : "No blank sectors";
  sectorsEl.textContent += " · " + chassisN + " chassis rays" + (dirty ? " · unsaved" : "");
}

function statusLine(deg, mm) {
  const head = level === "WAIT" ? "No scan yet" : (level + "  " + hz + " Hz");
  const where = (deg === undefined) ? "" : "  ·  " + Math.round(deg) + "°  " + mm + " mm";
  return head + where + (dirty ? "  ·  unsaved" : "");
}

function setBadge(name) {
  const mark = (name === "WAIT" || !travel) ? "" : travel + " ";
  badge.textContent = name === "WAIT" ? "WAIT" : mark + name;
  badge.className = name;
}

async function poll() {
  try {
    const res = await fetch("/api/status");
    const st = await res.json();
    if (Array.isArray(st.dist_mm) && st.dist_mm.length === 360) dist = st.dist_mm;
    hz = st.hz || 0;
    if (st.ms && st.ms !== lastMs) {
      lastMs = st.ms;
      lastChange = Date.now();
    }
    const stale = !lastMs || Date.now() - lastChange > 1200;
    if (st.dir === "F" || st.dir === "R" || st.dir === "S") travel = st.dir;
    highlightDir();
    level = stale ? "WAIT" : (st.level || "WAIT");
    setBadge(level);
    if (!drag) meta.textContent = statusLine();
    draw();
  } catch (err) {
    level = "WAIT";
    setBadge("WAIT");
  }
}

async function chooseDir(next) {
  travel = next;
  highlightDir();
  draw();
  await fetch("/api/dir", { method: "POST", body: next });
}
document.getElementById("dir-f").onclick = () => chooseDir("F");
document.getElementById("dir-r").onclick = () => chooseDir("R");
document.getElementById("dir-s").onclick = () => chooseDir("S");

document.getElementById("apply").onclick = async () => {
  if (teaching) return;
  const saved = await postConfig(collect(false));
  if (saved) applyConfig(saved);
};

document.getElementById("revert").onclick = () => loadConfig();

document.getElementById("clear-blank").onclick = () => {
  blank = new Array(360).fill(false);
  dirty = true;
  draw();
};

document.getElementById("teach").onclick = async () => {
  if (teaching) return;
  teaching = true;
  document.getElementById("teach").disabled = true;
  document.getElementById("apply").disabled = true;
  hint.textContent = "Teaching chassis. Keep the robot in an open space.";
  await postConfig(collect(true));
  for (let i = 0; i < 40; i++) {
    await new Promise((r) => setTimeout(r, 500));
    const res = await fetch("/api/config");
    const cfg = await res.json();
    if (!cfg.teach_chassis) {
      applyConfig(cfg);
      teaching = false;
      break;
    }
  }
  teaching = false;
  document.getElementById("teach").disabled = false;
  document.getElementById("apply").disabled = false;
  setMode(mode);
};

async function postConfig(cfg) {
  const res = await fetch("/api/config", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(cfg)
  });
  if (!res.ok) return null;
  return res.json();
}

loadConfig().then(poll);
setInterval(poll, 200);
</script>
</body>
</html>
